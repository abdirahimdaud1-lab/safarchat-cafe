<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SafarChat Café Accounts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Order Somali tea, coffee and bites from SafarChat Café, Mogadishu. Sign up, collect Stars, send gifts.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SafarChat">
<meta name="theme-color" content="#0C361F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Jost:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Brand symbols: the camel seal (small) and the full seal with ring text. Used everywhere via <use href="#seal">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="seal" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="50" fill="#0C361F"/>
      <image href="assets/camel.webp" x="6" y="6" width="88" height="88"/>
      <circle cx="50" cy="50" r="45.5" fill="none" stroke="#F5F0E6" stroke-width="3"/>
    </symbol>
    <symbol id="sealFull" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="50" fill="#0C361F"/>
      <circle cx="50" cy="50" r="47" fill="none" stroke="#F5F0E6" stroke-width="1.6"/>
      <circle cx="50" cy="50" r="44.6" fill="none" stroke="#F5F0E6" stroke-width=".7"/>
      <path id="arcTop" d="M 17 50 A 33 33 0 0 1 83 50" fill="none"/>
      <path id="arcBot" d="M 11 50 A 39 39 0 0 0 89 50" fill="none"/>
      <text font-family="Jost,Avenir Next,sans-serif" font-weight="600" font-size="8.6" letter-spacing="1.6" fill="#F5F0E6"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">SAFARCHAT CAFÉ</textPath></text>
      <text font-family="Jost,Avenir Next,sans-serif" font-weight="600" font-size="7.2" letter-spacing="1.8" fill="#F5F0E6"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">MOGADISHU</textPath></text>
      <rect x="9.6" y="48.4" width="3.2" height="3.2" fill="#F5F0E6" transform="rotate(45 11.2 50)"/>
      <rect x="87.2" y="48.4" width="3.2" height="3.2" fill="#F5F0E6" transform="rotate(45 88.8 50)"/>
      <circle cx="50" cy="50" r="29.5" fill="#0C361F"/>
      <image href="assets/camel.webp" x="21" y="21" width="58" height="58"/>
      <circle cx="50" cy="50" r="29.5" fill="none" stroke="#F5F0E6" stroke-width="1.6"/>
    </symbol>
  </defs>
</svg>

<!-- App shell: screens are filled in by js/pages/*.js -->
<div class="app" id="app">
  <main class="screens">
    <section class="screen" id="s-home" aria-label="Home"></section>
    <section class="screen" id="s-rewards" aria-label="Rewards" hidden></section>
    <section class="screen" id="s-order" aria-label="Order" hidden></section>
    <section class="screen" id="s-gifts" aria-label="Gifts" hidden></section>
    <section class="screen" id="s-account" aria-label="Account" hidden></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="auth" class="auth" hidden></div>
  <div id="overlays"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<!-- QR code library (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<!-- App scripts: order matters (core -> data -> ui -> pages -> app) -->
<script src="js/core/helpers.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/art.js"></script>
<script src="js/data/menu.js"></script>
<script src="js/data/gifts.js"></script>
<script src="js/data/regions.js"></script>
<script src="js/core/time.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/cart-math.js"></script>
<script src="js/ui/overlays.js"></script>
<script src="js/ui/tabbar.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/rewards.js"></script>
<script src="js/pages/order.js"></script>
<script src="js/pages/product.js"></script>
<script src="js/pages/cart.js"></script>
<script src="js/pages/checkout.js"></script>
<script src="js/pages/gifts.js"></script>
<script src="js/pages/account.js"></script>
<script src="js/pages/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
